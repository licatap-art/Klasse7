.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#14213d}
.chip:disabled{opacity:.4;cursor:not-allowed}
.cta{width:100%;border:0;border-radius:16px;padding:16px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:1.1rem}

.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);margin:10px 0 0;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:15px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:600;font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fact{background:var(--card);border-left:5px solid var(--sun);padding:12px 14px;border-radius:10px;margin:6px 0 16px}
.score{font-size:5rem;font-weight:800;line-height:1;margin:20px 0 4px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

  <div class="chips" id="cats"></div>
  <p style="margin:0">Wie viele Fragen?</p>
  <div class="chips" id="lens"></div>
  <p id="lenhint" style="margin:-12px 0 20px;font-size:.9rem"></p>

  <div class="best" id="best"></div>
</section>
<section id="quiz" hidden>

  <div class="meta"><span id="count"></span><span id="pts"></span></div>
  <h2 id="q"></h2>
  <div id="opts"></div>
  <div class="fact" id="fact" hidden></div>
  <button class="cta" id="next" hidden>Weiter</button>
</section>
<section id="end" hidden>
  <p id="endlabel" style="margin-top:28px">Dein Ergebnis</p>
  <div class="score" id="final"></div>
  <p id="verdict"></p>
  <div class="best" id="newbest" style="margin:0 0 20px"></div>
  <button class="cta" id="again">Nochmal spielen</button>
</section>
</main>

function poolSize(){return cat==="Mathe"||cat==="Alle"?999:Q.filter(function(q){return cat==="Alle"||q[0]===cat}).length}
function renderLens(){var n=poolSize(),box=$("lens"),vals=n<10?[n]:[10,20,30,50],ok=[];box.innerHTML="";
vals.forEach(function(v){var b=document.createElement("button");b.className="chip";b.textContent=n<10?"Alle "+n:v;b.dataset.v=v;if(v>n)b.disabled=true;else ok.push(v);b.onclick=function(){len=v;renderLens()};box.appendChild(b)});
if(ok.indexOf(len)<0)len=ok.indexOf(10)>=0?10:ok[0];
[].forEach.call(box.children,function(b){b.setAttribute("aria-pressed",+b.dataset.v===len&&!b.disabled)});
$("lenhint").textContent=n<50?"Hier gibt es "+n+" Fragen. Mehr folgen bald.":""}
function start(){var pool=Q.filter(function(q){return cat==="Alle"||q[0]===cat}),m=cat==="Mathe"?len:cat==="Alle"?Math.round(len/3):0;round=shuffle(shuffle(pool).slice(0,len-m).concat(genMath(m)));i=0;pts=0;show("quiz");ask()}
function ask(){done=false;var q=round[i];$("count").textContent="Frage "+(i+1)+" von "+round.length;$("pts").textContent=pts+" Punkte";
$("prog").style.width=(i/round.length*100)+"%";$("q").textContent=q[1];$("fact").hidden=true;$("next").hidden=true;$("opts").innerHTML="";
var order=shuffle([0,1,2,3]);order.forEach(function(k){var b=document.createElement("button");b.className="opt";b.textContent=q[2][k];b.onclick=function(){pick(b,k)};b.dataset.k=k;$("opts").appendChild(b)})}
function pick(btn,k){if(done)return;done=true;var q=round[i];if(k===q[3])pts++;
[].forEach.call($("opts").children,function(b){if(+b.dataset.k===q[3])b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
$("pts").textContent=pts+" Punkte";$("fact").textContent=(k===q[3]?"Richtig! ":"Leider falsch. ")+q[4];$("fact").hidden=false;
$("next").textContent=i===round.length-1?"Ergebnis ansehen":"Weiter";$("next").hidden=false;$("next").focus()}
function finish(){$("prog").style.width="100%";show("end");var n=round.length;$("final").textContent=pts+" / "+n;
var r=pts/n;$("verdict").textContent=r===1?"Perfekt! Kein Fehler.":r>=.8?"Stark! Du bist richtig fit.":r>=.5?"Solide. Eine Runde noch?":"Da geht noch was. Jede Runde macht dich besser.";
var b=load();if(pts>b){save(pts);$("newbest").textContent="Neuer Rekord!"}else{$("newbest").textContent="Rekord: "+b+" Punkte"}bestText()}
$("go").onclick=start;$("again").onclick=function(){show("start")};
$("next").onclick=function(){i++;if(i<round.length)ask();else finish()};
bestText();renderLens();
</script>
</body>
</html>
